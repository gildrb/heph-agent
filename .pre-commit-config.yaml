repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ty
        name: ty
        language: system
        entry: uv run --no-sync ty check
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        language: system
        entry: uv run --no-sync vulture
        types: [python]
        pass_filenames: false
