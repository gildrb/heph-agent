[project]
name = "heph"
version = "0.0.59"
description = "Local document agent for accurate, cited answers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gil", email = "mail@gildrb.com" },
]
requires-python = ">=3.14"
keywords = ["cli", "citations", "documents", "llm", "local", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "certifi==2026.2.25",
    "defusedxml==0.7.1",
    "pypdfium2==5.10.1",
    "rich==14.3.3",
]

[project.urls]
Homepage = "https://github.com/gildrb/heph-agent"
Repository = "https://github.com/gildrb/heph-agent"
Issues = "https://github.com/gildrb/heph-agent/issues"

[project.scripts]
heph = "heph.cli:main"

[dependency-groups]
dev = [
    "ruff==0.15.8",
    "ty==0.0.34",
    "vulture==2.16",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# hatch_build.py compiles core/build/heph-core.c (written by core/build.sh) into
# src/heph/_bin/heph-core and tags the wheel for the build platform.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/heph"]
artifacts = ["/src/heph/_bin/heph-core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/heph",
    "/core/*.bend",
    "/core/*.c",
    "/core/proof/*.bend",
    "/core/LAWS-REVIEW.md",
    "/core/build.sh",
    "/hatch_build.py",
]
exclude = ["/src/heph/_bin"]
artifacts = ["/core/build/heph-core.c"]

[tool.uv]
# Rebuild the editable install (and so the core binary) when the emitted C changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "core/build/heph-core.c" },
]

# Release wheels: one py3-none wheel per platform, built from the sdist (which ships the C).
[tool.cibuildwheel]
build = "cp314-*"
skip = "*-musllinux_*"
archs = ["native"]
test-command = [
    "heph --version",
    'export HEPH_ARMORY_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)"',
    "heph init smoke",
    'printf "Heph answers questions.\n" > "$HEPH_ARMORY_HOME/smoke/note.md"',
    "heph index smoke",
]

[tool.cibuildwheel.linux]
# Bend's C needs clang; the manylinux image ships only gcc.
before-all = "dnf install -y clang"

[tool.ruff]
line-length = 99
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "R",    # refactor
    "RET",  # flake8-return
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate (commented-out code)
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FURB", # refurb
    "PERF", # perflint
    "N",    # naming conventions
]
ignore = [
    "TRY003",   # long exception messages (fine for user-facing errors)
    "EM101",    # exception must not use string literals
    "EM102",    # exception must not use f-strings
    "TC001",    # MOVE type-only imports into type-checking block
    "TC002",    # MOVE type-only imports into type-checking block
    "TC003",    # MOVE type-only imports into type-checking block
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
all = "error"

[tool.vulture]
min_confidence = 80
paths = ["src"]
