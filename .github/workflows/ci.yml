name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Lockfile is current
        run: uv lock --check
      - name: Sync dependencies
        # The project itself needs the Bend-emitted C; the gates only need its dependencies.
        run: uv sync --frozen --group dev --no-install-project
      - name: Ruff check
        run: uv run --no-sync ruff check
      - name: Ruff format
        run: uv run --no-sync ruff format --check
      - name: Ty
        run: uv run --no-sync ty check
      - name: Vulture
        run: uv run --no-sync vulture

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: ./.github/actions/setup-bend
      - name: Prove the core laws and check the committed core C is current
        # core/build.sh runs `bend PROOF.bend` (must print "All terms check.") first.
        run: |
          core/build.sh
          git diff --exit-code -- core/build/heph-core.c
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          heph="$RUNNER_TEMP/smoke/bin/heph"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          export HEPH_ARMORY_HOME="$RUNNER_TEMP/armories"
          "$heph" --version
          "$heph" init smoke
          printf 'Heph answers questions from files.\n\nCitations are verified.\n' \
            > "$HEPH_ARMORY_HOME/smoke/materials/note.md"
          "$heph" index smoke

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
